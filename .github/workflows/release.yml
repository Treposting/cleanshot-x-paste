name: Release

# Actions → Release → Run workflow. Builds the universal DMG, creates the
# vX.Y.Z tag and publishes a GitHub Release with the DMG attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.3.0. Leave empty to use the version in Resources/Info.plist."
        required: false
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Building with the macOS 26 SDK turns on Liquid Glass for Marquee's windows and
      # controls on macOS 26 and 27 (apps built with older SDKs keep the old look).
      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PLIST=Resources/Info.plist
          CURRENT="$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")"
          VERSION="${INPUT_VERSION#v}"
          VERSION="${VERSION:-$CURRENT}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.2.3"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists. Pick a new version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bump=$([[ "$VERSION" != "$CURRENT" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (Info.plist has $CURRENT)"

      - name: Bump version in Info.plist
        if: steps.version.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PLIST=Resources/Info.plist
          BUILD="$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")"
          /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion $((BUILD + 1))" "$PLIST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Run tests
        run: swift test

      # Optional: sign with a stable certificate so macOS keeps Screen Recording and
      # Accessibility permissions across updates. See docs/SIGNING.md. Without these
      # secrets the build is signed ad hoc.
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          CERT_NAME: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "${CERT_P12}" ]]; then
            echo "No signing certificate configured; using ad-hoc signing."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # A self-signed identity isn't trusted, so codesign can't find it by name.
          # Sign by the identity's SHA-1 hash instead.
          NAME="${CERT_NAME:-Marquee Code Signing}"
          HASH="$(security find-identity -p codesigning "$KEYCHAIN" | awk -v n="\"$NAME\"" 'index($0, n) {print $2; exit}')"
          if [[ -z "$HASH" ]]; then
            security find-identity -p codesigning "$KEYCHAIN"
            echo "::error::Couldn't find the signing identity \"$NAME\" in the imported certificate."
            exit 1
          fi
          echo "SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"

      - name: Build universal app, DMG and update zip
        run: ./scripts/make-dmg.sh

      - name: Check the signature
        run: |
          codesign -dvv build/Marquee.app 2>&1 | grep -E "^(Authority|Signature|TeamIdentifier)" || true
          codesign -dr - build/Marquee.app 2>&1 | tail -1
          if [[ -n "${SIGN_IDENTITY:-}" ]] && codesign -dvv build/Marquee.app 2>&1 | grep -q "Signature=adhoc"; then
            echo "::error::A signing certificate is configured, but the app was signed ad hoc."
            exit 1
          fi
      # The release notes (also shown in Marquee's update window) are this version's
      # CHANGELOG section, followed by the install steps.
      - name: Release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {found = 1; next} found && /^## / {exit} found {print}' \
            CHANGELOG.md | sed '/./,$!d' > build/changes.md
          if [[ ! -s build/changes.md ]]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION; the release notes only have install steps."
          fi
          {
            cat build/changes.md
            echo
            echo "### Install"
            echo "1. Download **Marquee-$VERSION.dmg** below and drag Marquee into Applications."
            echo "2. On first launch, right-click the app and choose **Open** (the build isn't notarized yet)."
            echo "3. Allow **Screen & System Audio Recording** when macOS asks."
            echo
            echo "Already using Marquee? It updates itself: **Check for Updates…** in the menu bar."
            echo
            echo "Universal build for Apple Silicon and Intel, macOS 13 or later."
          } > build/release-notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Marquee ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.ref_name }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            build/*.dmg
            build/*.zip
          body_path: build/release-notes.md

      - name: Tell fixed issues about the release
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/issue-status.js');
            const version = '${{ steps.version.outputs.version }}';
            await run({ github, context, core }, 'release', {
              version: `v${version}`,
              url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/v${version}`,
            });
