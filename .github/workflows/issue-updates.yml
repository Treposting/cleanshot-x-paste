name: Issue updates

# Posts progress on issues mentioned in commit messages. See .github/scripts/issue-status.js.
# Release announcements happen in release.yml (a release made with GITHUB_TOKEN doesn't
# trigger other workflows).

on:
  push:
    branches: ["**"]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/issue-status.js');
            await run({ github, context, core }, 'push');
