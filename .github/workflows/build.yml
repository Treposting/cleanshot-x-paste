name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent ShotPaste.app ShotPaste.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ShotPaste
          path: build/ShotPaste.zip
