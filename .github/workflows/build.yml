name: Build

on:
  push:
    branches: ["**"]
    paths-ignore: ["site/**", "**.md", ".github/workflows/pages.yml"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Building with the macOS 26 SDK turns on Liquid Glass for Marquee's windows and
      # controls on macOS 26 and 27 (apps built with older SDKs keep the old look).
      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build universal app and DMG
        run: ./scripts/make-dmg.sh
      - name: Preview the app icon in light and dark mode
        run: |
          ICTOOL="$(xcode-select -p)/../Applications/Icon Composer.app/Contents/Executables/ictool"
          for rendition in Default Dark; do
            "$ICTOOL" build/AppIcon.icon --export-image --output-file "build/icon-$rendition.png" \
              --platform macOS --rendition "$rendition" --width 512 --height 512 --scale 1 || true
          done
          swift scripts/preview-icon.swift build/icon-Default.png build/icon-Dark.png || true
      - uses: actions/upload-artifact@v4
        with:
          name: Marquee-dmg
          path: |
            build/*.dmg
            build/icon-*.png
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
          generate_release_notes: true
