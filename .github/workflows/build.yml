name: Build

on:
  push:
    branches: ["**"]
    paths-ignore: ["site/**", "**.md", ".github/workflows/pages.yml"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Building with the macOS 26 SDK turns on Liquid Glass for Marquee's windows and
      # controls on macOS 26 and 27 (apps built with older SDKs keep the old look).
      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build universal app and DMG
        run: ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Marquee-dmg
          path: build/*.dmg
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
          generate_release_notes: true
