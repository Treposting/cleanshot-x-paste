name: Build

on:
  push:
    branches: ["**"]
    paths-ignore: ["site/**", "**.md", ".github/workflows/pages.yml"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build universal app and DMG
        run: ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ShotPaste-dmg
          path: build/*.dmg
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
          generate_release_notes: true
